name: Update US Financial Liquidity Cycle
on:
  workflow_dispatch:
  schedule:
    - cron: '37 12 * * 6'
permissions:
  contents: write
concurrency:
  group: update-liquidity-cycle
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'requests>=2.31,<3'
      - name: Update data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python update_liquidity_cycle.py
      - name: Commit updated JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/liquidity_cycle.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update financial liquidity cycle'
          git pull --rebase origin main
          git push origin HEAD:main
