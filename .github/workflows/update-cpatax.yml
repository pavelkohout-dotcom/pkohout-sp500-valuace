name: Automaticka aktualizace CPATAX
on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * 1-6"

permissions:
  contents: write

concurrency:
  group: update-cpatax
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FRED CPATAX
        run: python update_cpatax.py
      - name: Commit novych dat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cpatax.json
          if git diff --cached --quiet; then
            echo "Beze zmeny."
            exit 0
          fi
          git commit -m "CPATAX auto-update"
          git pull --rebase origin main
          git push
