name: Aktualizace valuace S&P 500

on:
  workflow_dispatch:

  schedule:
    # Během obchodních hodin USA každých 30 minut (13:00–21:30 UTC,
    # pokryje letní i zimní čas; mimo seanci Yahoo vrací poslední zavření).
    - cron: "*/30 13-21 * * 1-5"
    # Po zavření trhu: oficiální zavírací hodnota dne.
    - cron: "30 22 * * 1-5"
    # Ráno: nové měsíční údaje z FRED (peněžní zásoba).
    - cron: "30 5 * * 2-6"

permissions:
  contents: write

# Dva běhy najednou by se při ukládání potkaly; další počká.
concurrency:
  group: update-valuation
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Nainstalovat knihovny
        run: pip install -r requirements.txt

      - name: Přepočítat data
        run: python update_valuation.py

      - name: Uložit nový JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mzm_ratio.json
          if git diff --cached --quiet; then
            echo "Žádná změna dat."
            exit 0
          fi
          git commit -m "Automatická aktualizace valuace"
          # Jiné workflow (VIX, sazby, ...) ukládají do stejné větve.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
