name: Aktualizace valuace S&P 500

on:
  workflow_dispatch:

  schedule:
    - cron: "20 23 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Nainstalovat knihovny
        run: pip install -r requirements.txt

      - name: Přepočítat data
        run: python update_valuation.py

      - name: Uložit nový JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mzm_ratio.json
          if git diff --cached --quiet; then
            echo "Žádná změna dat."
            exit 0
          fi
          git commit -m "Automatická aktualizace valuace"
          git push
