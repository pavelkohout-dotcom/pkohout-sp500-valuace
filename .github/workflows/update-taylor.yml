name: Aktualizace Taylor Rule Gap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update_taylor.py
      - .github/workflows/update-taylor.yml
  schedule:
    - cron: '45 15 * * 1-5'

permissions:
  contents: write

concurrency:
  group: update-taylor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Načíst PCEPI a FEDFUNDS za shodný měsíc
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python update_taylor.py
      - name: Uložit ověřená data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/taylor_gap.json
          if git diff --cached --quiet; then
            echo 'Taylor gap beze změny.'
            exit 0
          fi
          git commit -m 'Aktualizace Taylor Rule Gap z FRED'
          git pull --rebase origin main
          git push origin HEAD:main
