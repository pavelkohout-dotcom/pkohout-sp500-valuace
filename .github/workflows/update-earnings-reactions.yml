name: EPS beat price reactions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [update_earnings_reactions.py, requirements-earnings-reactions.txt, .github/workflows/update-earnings-reactions.yml]
  schedule:
    - cron: '35 23 * * 1-5'
    - cron: '35 7 * * 2-6'
permissions:
  contents: write
concurrency:
  group: earnings-reactions
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-earnings-reactions.txt
      - run: python -m unittest discover -s tests -p 'test_earnings_reactions.py'
      - run: python update_earnings_reactions.py
      - name: Publish verified sample
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/earnings_reactions.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update observed EPS beat price reactions'
          git pull --rebase origin main
          git push origin HEAD:main
