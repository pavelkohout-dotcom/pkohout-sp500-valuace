name: Intraday VIX and S&P 500
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [update_vix_intraday.py, update_market_intraday.py, data/market_calendar.json, .github/workflows/update-vix-intraday.yml]
  schedule:
    # Backup only: continuation normally uses workflow_dispatch, not cron.
    - cron: '17 */4 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: update-vix-intraday
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*intraday.py'
      - name: Configure publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Poll and publish during US trading
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          duration=300
          if [ "$EVENT_NAME" = "push" ]; then duration=1; fi
          python -u update_market_intraday.py --watch --publish --duration-minutes "$duration"
      - name: Hand off to the next bounded worker
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run update-vix-intraday.yml --ref main; then exit 0; fi
            sleep 10
          done
          exit 1
