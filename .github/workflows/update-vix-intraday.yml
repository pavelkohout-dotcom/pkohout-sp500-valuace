name: Intraday VIX and S&P 500
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [update_vix_intraday.py, update_market_intraday.py, .github/workflows/update-vix-intraday.yml]
  schedule:
    # A running job polls every five minutes. Hourly starts replenish the worker;
    # scheduling itself is best effort, so the browser still checks quote age.
    - cron: '7 12-22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: update-vix-intraday
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*intraday.py'
      - name: Configure publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Poll and publish during US trading
        run: python -u update_market_intraday.py --watch --publish
