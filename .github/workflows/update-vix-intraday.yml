name: Intraday VIX
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [update_vix_intraday.py, .github/workflows/update-vix-intraday.yml]
  schedule:
    # Covers regular US trading + delayed close in both EST and EDT.
    # GitHub schedules are best effort; the UI checks observation age itself.
    - cron: '2-57/5 13-22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: update-vix-intraday
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_vix*.py'
      - run: python update_vix_intraday.py
      - name: Publish quote with its original timestamp
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vix_intraday.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update intraday VIX observation'
          git pull --rebase origin main
          git push origin HEAD:main
