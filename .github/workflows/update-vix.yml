name: Aktualizace VIXCLS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update_vix.py
      - .github/workflows/update-vix.yml
  schedule:
    - cron: '17 * * * 1-5'

permissions:
  contents: write

concurrency:
  group: update-vix
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Načíst poslední denní závěr VIXCLS
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python update_vix.py
      - name: Uložit ověřená data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vixcls.json
          if git diff --cached --quiet; then
            echo 'VIX beze změny.'
            exit 0
          fi
          git commit -m 'Aktualizace VIXCLS z FRED'
          git pull --rebase origin main
          git push origin HEAD:main
