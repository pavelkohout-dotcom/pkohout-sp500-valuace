<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valuace S&P 500</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    color: #202020;
    background: #ffffff;
  }
  .wrap {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 14px 10px 8px;
  }
  .headline {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .sub {
    color: #666;
    font-size: 13px;
    line-height: 1.45;
    margin-bottom: 12px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  .card {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px 12px;
  }
  .label {
    color: #6b6b6b;
    font-size: 12px;
    margin-bottom: 4px;
  }
  .value {
    font-size: 21px;
    font-weight: 700;
  }
  .date {
    font-size: 11px;
    color: #777;
    margin-top: 3px;
  }
  .chartbox {
    position: relative;
    width: 100%;
    height: 430px;
  }
  .note {
    font-size: 11px;
    line-height: 1.45;
    color: #707070;
    margin-top: 10px;
  }
  .error {
    border: 1px solid #d8a0a0;
    background: #fff5f5;
    padding: 12px;
    border-radius: 8px;
  }
  @media (max-width: 700px) {
    .cards { grid-template-columns: 1fr; }
    .chartbox { height: 330px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="headline">Valuace S&amp;P 500 vůči upravené peněžní zásobě</div>
  <div class="sub">
    Index 100 odpovídá poměru S&amp;P 500 / Foreign-Adjusted MZM Proxy = 0,15.
  </div>

  <div id="status"></div>

  <div class="cards" id="cards" style="display:none">
    <div class="card">
      <div class="label">S&amp;P 500</div>
      <div class="value" id="sp500">—</div>
      <div class="date" id="sp500date">—</div>
    </div>
    <div class="card">
      <div class="label">Foreign-Adjusted MZM Proxy</div>
      <div class="value" id="mzm">—</div>
      <div class="date" id="mzmdate">—</div>
    </div>
    <div class="card">
      <div class="label">Valuační index</div>
      <div class="value" id="valuation">—</div>
      <div class="date">100 = poměr 0,15</div>
    </div>
  </div>

  <div class="chartbox">
    <canvas id="chart"></canvas>
  </div>

  <div class="note" id="note"></div>
</div>

<script>
/*
  JEDINÁ VĚC, KTEROU MUSÍTE ZMĚNIT:
  místo USERNAME napište své uživatelské jméno na GitHubu.
  Název repozitáře je v návodu doporučen jako pkohout-sp500-valuace.
*/
const DATA_URL =
  "https://raw.githubusercontent.com/USERNAME/pkohout-sp500-valuace/main/data/mzm_ratio.json";

function czNumber(x, digits=2) {
  if (x === null || x === undefined || Number.isNaN(Number(x))) return "—";
  return Number(x).toLocaleString("cs-CZ", {
    minimumFractionDigits: digits,
    maximumFractionDigits: digits
  });
}

function czDate(iso) {
  if (!iso) return "—";
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y, m-1, d).toLocaleDateString("cs-CZ");
}

async function loadData() {
  const status = document.getElementById("status");

  try {
    const response = await fetch(DATA_URL + "?t=" + Date.now(), {cache: "no-store"});
    if (!response.ok) throw new Error("HTTP " + response.status);

    const data = await response.json();

    if (data.status !== "ok" || !data.current_snapshot) {
      throw new Error("Automatická data ještě nebyla vygenerována.");
    }

    const s = data.current_snapshot;
    document.getElementById("cards").style.display = "grid";
    document.getElementById("sp500").textContent = czNumber(s.sp500, 2);
    document.getElementById("sp500date").textContent =
      "stav k " + czDate(s.sp500_date);

    document.getElementById("mzm").textContent = czNumber(s.foreign_adjusted_mzm, 1);
    document.getElementById("mzmdate").textContent =
      "měnová data k " + czDate(s.foreign_adjusted_mzm_date);

    document.getElementById("valuation").textContent = czNumber(s.index, 1);

    const points = data.chart_points || [];
    const labels = points.map(p => p.date);
    const values = points.map(p => p.index);

    const avg = data.five_year_monthly_average;
    const avgValues = points.map(() => avg);

    new Chart(document.getElementById("chart"), {
      type: "line",
      data: {
        labels,
        datasets: [
          {
            label: "Valuační index",
            data: values,
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.12
          },
          {
            label: "5letý měsíční průměr",
            data: avgValues,
            borderWidth: 1,
            pointRadius: 0,
            borderDash: [6, 6],
            tension: 0
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {mode: "index", intersect: false},
        plugins: {
          legend: {display: true},
          tooltip: {
            callbacks: {
              label: ctx => ctx.dataset.label + ": " + czNumber(ctx.raw, 1)
            }
          }
        },
        scales: {
          x: {
            ticks: {
              maxTicksLimit: 8,
              callback: function(value) {
                const raw = this.getLabelForValue(value);
                const dt = new Date(raw + "T00:00:00");
                return dt.toLocaleDateString("cs-CZ", {month:"short", year:"numeric"});
              }
            },
            grid: {display: false}
          },
          y: {
            title: {display: true, text: "Index"},
            ticks: {
              callback: v => Number(v).toLocaleString("cs-CZ")
            }
          }
        }
      }
    });

    document.getElementById("note").textContent =
      "Poslední bod může kombinovat poslední dostupnou denní hodnotu S&P 500 " +
      "s poslední publikovanou měsíční hodnotou peněžní zásoby. " +
      "Data: Federal Reserve Bank of St. Louis (FRED).";

    status.innerHTML = "";
  } catch (err) {
    status.innerHTML =
      '<div class="error"><strong>Data se nepodařilo načíst.</strong><br>' +
      'Po prvním spuštění GitHub Actions obnovte stránku. ' +
      'Pokud problém trvá, zkontrolujte DATA_URL v HTML.<br><small>' +
      String(err) + '</small></div>';
  }
}

loadData();
</script>
</body>
</html>
